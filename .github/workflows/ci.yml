name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit always-on check for CLARABEL/SCS-only conic suite shape (no vendor Moreau).
  conic-trusted-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dev tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev]"
      - name: Conic suite (trusted public solver only)
        run: |
          mkdir -p /tmp/ci_evidence
          python -m pytest tests/reference/test_reference_conic_trusted_shape.py -q --tb=short \
            --junitxml=/tmp/ci_evidence/conic_trusted.junit.xml
          python scripts/assert_min_executed_tests.py \
            --junit /tmp/ci_evidence/conic_trusted.junit.xml \
            --min-executed 1 \
            --label conic-trusted-shape

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dev tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev,solver-public]" -c packaging/constraints/solver-public.txt
          python scripts/check_solver_stack_policy.py
      - name: Ruff
        run: python -m ruff check conicshield tests
      - name: Ruff format
        run: python -m ruff format --check conicshield tests
      - name: Mypy
        run: python -m mypy conicshield tests
      - name: Public/reference tests with coverage
        run: |
          mkdir -p /tmp/ci_evidence
          python -m pytest tests/ -q --cov=conicshield --cov-report=term-missing \
            --junitxml=/tmp/ci_evidence/public_pytest.junit.xml
          python scripts/assert_min_executed_tests.py \
            --junit /tmp/ci_evidence/public_pytest.junit.xml \
            --min-executed 50 \
            --label public-quality
      - name: Fallback / fail-safe path tests
        run: |
          python -m pytest -q --tb=short \
            tests/verification/test_verification_release.py \
            tests/platform/sidecar/test_client_fallback.py
      - name: Schema compatibility
        run: python scripts/check_schema_compatibility.py
      - name: Verification scripts (public smoke artifacts)
        if: success() || failure()
        run: |
          python scripts/environment_check.py
          python scripts/smoke_check.py
          python scripts/differentiation_check.py --probe-torch-jax
          python scripts/generate_trust_dashboard.py
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: verification-output-${{ matrix.python-version }}
          path: output/
          if-no-files-found: warn
      - name: Upload structured test evidence
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: public-test-evidence-${{ matrix.python-version }}
          path: /tmp/ci_evidence/
          if-no-files-found: warn
