[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conicshield"
version = "0.1.0"
description = "Proof-aware runtime safety shields, governed benchmarks, and native parity validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fraware" }]
keywords = ["safety", "rl", "convex-optimization", "benchmarks", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.7",
  "typing-extensions>=4.10",
  "cvxpy>=1.8.2",
  "cvxpylayers>=1.0.4",
  "jsonschema>=4.23",
]

[project.scripts]
conicshield = "conicshield.cli:main"
conicshield-published-runs = "conicshield.published_runs.cli:main"

[project.urls]
Homepage = "https://github.com/fraware/conicshield"
Repository = "https://github.com/fraware/conicshield"
Documentation = "https://github.com/fraware/conicshield/blob/main/docs/COMMUNITY_LAYER.md"
Issues = "https://github.com/fraware/conicshield/issues"

[project.optional-dependencies]
# Public / reference solvers only — never pulls CUDA or vendor Moreau.
solver-public = [
  "clarabel==0.11.1; python_version >= '3.11' and python_version < '3.13'",
  "scs==3.2.11; python_version >= '3.11' and python_version < '3.13'",
]
# Vendor Moreau CPU wheels (Linux/WSL). Requires vendor extra-index; see docs.
# Exact governed pins live in packaging/constraints/ — do not rely on lower bounds alone.
solver-moreau-cpu = [
  "moreau; python_version >= '3.11' and python_version < '3.13' and sys_platform == 'linux'",
]
# Vendor Moreau with CUDA extras (Linux/WSL). Do not use on CPU-only hosts.
solver-moreau-cuda = [
  "moreau[cuda]; python_version >= '3.11' and python_version < '3.13' and sys_platform == 'linux'",
]
diff-torch = [
  "torch>=2.2.0; python_version >= '3.11' and python_version < '3.13'",
]
diff-jax = [
  "jax>=0.4.28; python_version >= '3.11' and python_version < '3.13'",
  "jaxlib>=0.4.28; python_version >= '3.11' and python_version < '3.13'",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "python-dotenv>=1.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-tools>=7.4",
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "types-jsonschema>=4.23",
]
# Deprecated alias: historically installed moreau[cuda]. Now maps to CPU-only
# vendor extra to avoid surprise CUDA pulls. Prefer solver-moreau-cpu / cuda.
solver = [
  "moreau; python_version >= '3.11' and python_version < '3.13' and sys_platform == 'linux'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["conicshield*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cvxpy_moreau_projector.py" = ["E402"]
"tests/vendor/native/test_native_moreau_projector.py" = ["E402"]
"tests/vendor/native/test_shield_native_softmax_batch.py" = ["E402"]
"tests/vendor/diff/test_inter_sim_shield_projection_fd.py" = ["E402"]
"tests/test_shield_solver_integration.py" = ["E402"]
"tests/test_replay_hypothesis_optional.py" = ["E402"]
"tests/test_replay_banks_hypothesis_optional.py" = ["E402"]
"tests/reference/test_reference_conic_correctness.py" = ["E402"]
"tests/reference/test_reference_conic_trusted_shape.py" = ["E402"]
"conicshield/bench/passthrough_projector.py" = ["ARG002"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not solver and not requires_moreau and not inter_sim_rl and not slow\" --durations=15"
markers = [
  "solver: solver-related tests (public cvxpy stack and/or vendor Moreau integration)",
  "vendor_moreau: requires vendor Moreau installation and license",
  "integration: cross-module or external integration tests",
  "requires_moreau: requires installed moreau package and license",
  "inter_sim_rl: requires forked inter-sim-rl checkout (INTERSIM_RL_ROOT or submodule path)",
  "slow: long-running subprocess or env setup (optional filter: -m \"not slow\")",
  "reference_correctness: shield-QP or reference-vs-reference correctness checks",
  "performance_benchmark: timing / scaling tests (optional vendor hardware)",
  "live_vendor: selected in scripts/run_live_vendor_tests.py (Moreau / inter-sim-rl / solver-marked tests)",
  "stabilization_regression: Track-1 S0+ defect regressions (often xfail(strict=True) until fixed)",
  "research: Track 2 research suite (experimental; see research/solver-assurance-and-gradients/)",
]
filterwarnings = [
  "ignore::pytest.PytestDeprecationWarning:pytest_asyncio.*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "cvxpy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moreau"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "conicshield.experimental.*"
disallow_untyped_defs = true

[tool.coverage.run]
source = ["conicshield"]
omit = ["conicshield/experimental/*"]

[tool.coverage.report]
fail_under = 58
show_missing = true
